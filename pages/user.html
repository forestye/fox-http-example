<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当事人 · fox-http 示例</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script type="application/x-cpp-head">
        #include "db/db.h"
        #include "db/user.h"
    </script>
    <script type="application/x-cpp-source">
        auto conn = DB::instance().acquire();
        UserRepo userRepo(conn.ref());
        auto user = userRepo.get_one_by_id(id);
    </script>
</head>
<body>
    <header class="rail">
        <a href="/" class="rail__brand">
            <span class="seal">范</span>
            <span>fox-http 示例</span>
        </a>
        <nav class="rail__nav">
            <a href="/">卷首</a>
            <a href="/users">名录</a>
            <a href="/userinfo/1">接口</a>
            <a href="/test/abc/string/42">路径</a>
        </nav>
        <div class="rail__meta">
            GET /user/{{id}}
        </div>
    </header>

    <main class="page">
        <section class="profile" cpp-if="user">
            <div class="chapter reveal reveal--1">册中一人</div>
            <div class="profile__id reveal reveal--2">第 {{id}} 号</div>
            <h1 class="profile__name reveal reveal--3" cpp-text="(*user).username()">—</h1>
            <p class="profile__lede reveal reveal--4">
                user 表中的一行，按 id 从 MySQL 取出，由服务端直接渲出。
                同一条记录另有 JSON 版本，<code>/userinfo/{{id}}</code> 即得。
            </p>

            <div class="spec reveal reveal--5">
                <div class="spec__row">
                    <span class="spec__label">编号</span>
                    <span class="spec__value">{{id}}</span>
                </div>
                <div class="spec__row">
                    <span class="spec__label">姓名</span>
                    <span class="spec__value spec__value--name" cpp-text="(*user).username()">—</span>
                </div>
                <div class="spec__row">
                    <span class="spec__label">邮箱</span>
                    <span class="spec__value" cpp-text="(*user).email()">—</span>
                </div>
                <div class="spec__row">
                    <span class="spec__label">登录簿</span>
                    <span class="spec__value" cpp-text="(*user).created_at()">—</span>
                </div>
            </div>
        </section>

        <section cpp-if="!user">
            <div class="empty">
                <div class="empty__code">404 · 无此行</div>
                <h2 class="empty__title">查无此人。</h2>
                <p class="empty__sub">user 表中没有 id = {{id}} 的行。</p>
                <a href="/users" class="empty__back">← 翻名录</a>
            </div>
        </section>

        <footer class="footer">
            <div><a href="/users">← 名录</a></div>
            <div>SELECT * FROM user WHERE id = {{id}}</div>
        </footer>
    </main>
</body>
</html>
